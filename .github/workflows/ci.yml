name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-and-build:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Unit & Integration Suites
        run: npm test

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: "https://meirei-rho.vercel.app"
          NEXT_PUBLIC_CHAIN_ID: "196"
          NEXT_PUBLIC_XLAYER_RPC: "https://rpc.xlayer.tech"
          NEXT_PUBLIC_EXPLORER_URL: "https://www.okx.com/web3/explorer/xlayer"
          OTP_SECRET: "CHANGE_ME_GENERATE_WITH_OPENSSL_RAND_BASE64_48_TEST_ENV"
